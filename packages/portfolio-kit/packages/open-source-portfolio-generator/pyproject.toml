[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="open-source-portfolio-generator"
version="0.1.0"
description="Offline public-only repository portfolio generator"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
portfolio-generator="open_source_portfolio_generator:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
