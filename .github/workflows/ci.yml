name: Profile evidence

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate local monorepo source bindings
        run: python3 scripts/check_monorepo.py
      - name: Validate public profile contract
        run: node scripts/check-profile.mjs --root .
      - name: Verify generated dashboard and source TTL
        run: node scripts/generate-dashboard.mjs --root . --check --require-current
      - name: Validate embedded Portfolio Kit
        shell: bash
        run: |
          cd packages/portfolio-kit
          python3 scripts/check_portfolio_kit.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m compileall -q scripts tests
          for package in build-metrics-collector github-profile-dashboard open-source-portfolio-generator; do
            (
              cd "packages/$package"
              PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py'
              python3 -m compileall -q src tests
            )
          done
      - name: Run profile and dashboard counter-proofs
        run: node --test test/*.test.mjs
