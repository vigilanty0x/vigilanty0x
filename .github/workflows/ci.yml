name: Profile evidence

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate public profile contract
        run: node scripts/check-profile.mjs --root .
      - name: Verify generated dashboard and source TTL
        run: node scripts/generate-dashboard.mjs --root . --check --require-current
      - name: Run profile and dashboard counter-proofs
        run: node --test test/*.test.mjs
